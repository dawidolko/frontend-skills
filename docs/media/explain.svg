<text x="18" y="66"><tspan class="a">~/shop $ </tspan>npx github:dawidolko/frontend-skills explain a11y/img-alt</text>
<text x="18" y="86" class="r" style="animation-name:r1"><tspan class="i">a11y/img-alt</tspan>  (<tspan class="c">critical</tspan>, static, WCAG 1.1.1 level A)</text>
<text x="18" y="106" class="r" style="animation-name:r2"><tspan class="g">Every img and area element has an alt attribute; a decorative image has alt="".</tspan></text>
<text x="18" y="126" class="r" style="animation-name:r3"></text>
<text x="18" y="146" class="r" style="animation-name:r4"><tspan class="h">Why</tspan></text>
<text x="18" y="166" class="r" style="animation-name:r5">Without `alt`, a screen reader announces the file name or nothing, and the image's meaning is</text>
<text x="18" y="186" class="r" style="animation-name:r6">lost; when the image fails to load, nothing replaces it.</text>
<text x="18" y="206" class="r" style="animation-name:r7"></text>
<text x="18" y="226" class="r" style="animation-name:r8"><tspan class="h">Fix</tspan></text>
<text x="18" y="246" class="r" style="animation-name:r9">Describe what the image says in this context (`alt="Revenue grew 20% in 2026"`), not what it</text>
<text x="18" y="266" class="r" style="animation-name:r10">looks like. For an image that only decorates, write `alt=""` so assistive technology skips it.</text>
<text x="18" y="286" class="r" style="animation-name:r11">An image inside a link that has no other text needs the link's purpose as its alt.</text>
<text x="18" y="306" class="r" style="animation-name:r12"></text>
<text x="18" y="326" class="r" style="animation-name:r13"><tspan class="h">Examples</tspan></text>
<text x="18" y="346" class="r" style="animation-name:r14"><tspan class="d">```html</tspan></text>
<text x="18" y="366" class="r" style="animation-name:r15">&lt;!-- bad --&gt;</text>
<text x="18" y="386" class="r" style="animation-name:r16">&lt;img src="chart.png"&gt;</text>
<text x="18" y="406" class="r" style="animation-name:r17">&lt;!-- good --&gt;</text>
<text x="18" y="426" class="r" style="animation-name:r18">&lt;img src="chart.png" alt="Revenue grew 20% in 2026"&gt;</text>
<text x="18" y="446" class="r" style="animation-name:r19">&lt;img src="divider.svg" alt=""&gt;</text>
<text x="18" y="466" class="r" style="animation-name:r20"><tspan class="d">```</tspan></text>
<text x="18" y="486" class="r" style="animation-name:r21"></text>
<text x="18" y="506" class="r" style="animation-name:r22"><tspan class="h">Sources</tspan></text>
<text x="18" y="526" class="r" style="animation-name:r23">- WCAG 2.2, Understanding SC 1.1.1 Non-text Content:</text>
<text x="18" y="546" class="r" style="animation-name:r24">  <tspan class="u">https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html</tspan></text>
<text x="18" y="566" class="r" style="animation-name:r25">- MDN, the img element (alt):</text>
<text x="18" y="586" class="r" style="animation-name:r26">  <tspan class="u">https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/img</tspan></text>
<text x="18" y="606" class="r" style="animation-name:r27">- WAI Images Tutorial, decorative images: <tspan class="u">https://www.w3.org/WAI/tutorials/images/decorative/</tspan></text>
<text x="18" y="626" class="r" style="animation-name:r28"></text>
<text x="18" y="646" class="r" style="animation-name:r29">Taught by the skill fe-html.</text>
<text x="18" y="666" class="r" style="animation-name:r30"><tspan class="a">~/shop $ </tspan></text>
