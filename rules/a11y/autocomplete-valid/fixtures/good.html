<form autocomplete="on">
  <label for="mail">Email</label>
  <input id="mail" type="email" autocomplete="email">
  <label for="tel">Phone</label>
  <input id="tel" type="tel" autocomplete="section-buyer mobile tel">
  <label for="zip">Postcode</label>
  <input id="zip" autocomplete="shipping postal-code">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password webauthn">
</form>
