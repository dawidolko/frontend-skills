<label for="zip">Postal code</label>
<input id="zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code">
<label for="otp">Code from the app</label>
<input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}">
<label for="qty">Quantity</label>
<input id="qty" name="quantity" type="number" min="1" max="10">
<label for="age">Age</label>
<input id="age" name="age" type="number" min="0">
<label for="nights">Hotel nights</label>
<input id="nights" name="hotelNights" type="number" min="1">
<label for="spin">Spinner speed</label>
<input id="spin" name="spinner-speed" type="number">
