<!doctype html>
<!--
  The thumbnail of the Frontend Skills video and post. build.mjs opens it with ?w=&h=&lang=en|pl&photo=&rules=&agents=
  and screenshots it: the author's portrait on the right, the mark, a short headline and the counts on the left.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Frontend Skills thumbnail</title>
    <style>
      @font-face {
        font-family: "Open Sans";
        font-weight: 300 700;
        src: url(../../site/assets/fonts/opensans-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20C4, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Open Sans";
        font-weight: 300 700;
        src: url(../../site/assets/fonts/opensans-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0d0d0f;
      }
      #t {
        position: relative;
        overflow: hidden;
        width: calc(var(--w) * 1px);
        height: calc(var(--h) * 1px);
        background:
          radial-gradient(circle at 18% 12%, rgb(168 0 209 / 0.42), transparent 55%),
          radial-gradient(rgb(255 255 255 / 0.07) 1.4px, transparent 1.6px) 0 0 / 30px 30px,
          #0d0d0f;
        color: #f0f0f0;
        font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
        --u: calc(var(--h) / 720 * 1px);
      }
      .photo {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        aspect-ratio: 1;
        background-size: cover;
        background-position: center 20%;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 34%);
        mask-image: linear-gradient(to right, transparent 0%, #000 34%);
      }
      .left {
        position: absolute;
        left: calc(60 * var(--u));
        top: calc(56 * var(--u));
        bottom: calc(56 * var(--u));
        width: 62%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: calc(18 * var(--u));
        font-size: calc(40 * var(--u));
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .brand svg {
        width: calc(78 * var(--u));
        height: calc(78 * var(--u));
      }
      .brand svg rect {
        fill: #d77cf6;
      }
      .brand svg path {
        fill: none;
        stroke: #0d0d0f;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        margin: 0;
        font-size: calc(96 * var(--u));
        line-height: 1.02;
        letter-spacing: calc(-2.5 * var(--u));
        font-weight: 700;
        text-shadow: 0 4px 30px rgb(0 0 0 / 0.6);
      }
      h1 span {
        display: block;
        color: #e08cff;
      }
      .chips {
        display: flex;
        gap: calc(14 * var(--u));
        flex-wrap: wrap;
      }
      .chip {
        padding: calc(10 * var(--u)) calc(24 * var(--u));
        border-radius: 999px;
        background: #2a1733;
        border: 2px solid rgb(210 100 245 / 0.6);
        color: #f3d0ff;
        font-size: calc(30 * var(--u));
        font-weight: 700;
      }
      .chip.free {
        background: #f0f0f0;
        border-color: #f0f0f0;
        color: #0d0d0f;
      }
    </style>
  </head>
  <body>
    <div id="t">
      <div class="photo"></div>
      <div class="left">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M12.5 10 7 16l5.5 6M19.5 10 25 16l-5.5 6"/></svg>
          Frontend Skills
        </div>
        <h1></h1>
        <div class="chips">
          <span class="chip free" id="free"></span>
          <span class="chip" id="rules"></span>
          <span class="chip" id="agents"></span>
        </div>
      </div>
    </div>
    <script>
      const q = new URLSearchParams(location.search)
      const t = document.getElementById('t')
      t.style.setProperty('--w', q.get('w'))
      t.style.setProperty('--h', q.get('h'))
      document.querySelector('.photo').style.backgroundImage = `url("${q.get('photo')}")`
      const TEXT = {
        en: { title: 'Teach your<br>AI agent <span>better front‑end</span>', free: 'Free · MIT', rules: 'rules', agents: 'agents' },
        pl: { title: 'Naucz agenta AI <span>lepszego<br>front‑endu</span>', free: 'Darmowe · MIT', rules: 'reguł', agents: 'agentów' }
      }
      const lang = q.get('lang') === 'en' ? 'en' : 'pl'
      const x = TEXT[lang]
      document.documentElement.lang = lang
      document.querySelector('h1').innerHTML = x.title
      if (lang === 'pl') document.querySelector('h1').style.fontSize = 'calc(84 * var(--u))'
      document.getElementById('free').textContent = x.free
      document.getElementById('rules').textContent = `${q.get('rules')} ${x.rules}`
      document.getElementById('agents').textContent = `${q.get('agents')} ${x.agents}`
    </script>
  </body>
</html>
